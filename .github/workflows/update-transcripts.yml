name: Check Transcript Freshness

on:
  schedule:
    # Sunday at noon PST (20:00 UTC)
    - cron: '0 20 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Check for missing published videos
        run: python scripts/fetch_new_episodes.py --check-only
